<ion-content [fullscreen]="true" id="full-page">
  <div id="pink-container" *ngIf="currentTab !== 'dashboard'">
    <div class="bank-info">
     
      <img src="assets/rightlogo.png" class="back-icon" alt="Back" (click)="goBack()"/>
      <h1 class="dashboard-text" >
      
        {{ 'MY_QR_CODE' | translate }}
      </h1>
    </div>
  </div>

  <div id="qr-container" *ngIf="currentTab === 'qr-code'">
    <div class="qr-code-container">
      <img *ngIf="base64QrCode" [src]="base64QrCode" alt="QR Code" class="qr-code" />
      <ion-text *ngIf="!base64QrCode">{{ 'NO_QR_CODE' | translate }}</ion-text>
    </div>

<div  class="share-button">
  <ion-button type="submit" class="new-conversation" (click)="shareQrCode()">
    <div class="btn-content">
      <ion-img src="assets/share.png"></ion-img>
      <ion-label class="v"   >   {{ 'SHARE_QR_CODE' | translate }}</ion-label>
    </div>
  </ion-button>
</div>

  </div>
</ion-content>
