buildscript {
    ext.kotlin_version = '1.8.20' // Kotlin version
    repositories {
        google() // Google's Maven repository
        mavenCentral() // Maven Central repository
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.1' // Android Gradle Plugin
        classpath 'com.google.gms:google-services:4.4.0' // Google Services plugin
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" // Kotlin Gradle plugin
    }
}

// Apply variables.gradle if it exists
if (file("variables.gradle").exists()) {
    apply from: "variables.gradle"
}

allprojects {
    repositories {
        google() // Google's Maven repository
        mavenCentral() // Maven Central repository
    }

    // Configure Kotlin compilation for all projects
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = '21' // Set JVM target to Java 17
            allWarningsAsErrors = true // Treat all warnings as errors (optional)
        }
    }
}

// Clean task to delete the build directory
task clean(type: Delete) {
    delete rootProject.buildDir
}